<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
  <rect width="1600" height="900" fill="#F8FAFC"/>

  <!-- ===== Header ===== -->
  <text x="1520" y="80" text-anchor="end" font-size="13" fill="#94A3B8">Yio · 跨引擎游戏 UI 框架</text>
  <rect x="80" y="58" width="140" height="34" rx="17" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="150" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#047857">价值 · 迈向 L4</text>
  <text x="80" y="146" font-size="42" font-weight="700" fill="#0F172A">以机器验证替代人工监督，迈向 L4 全自主开发</text>
  <text x="80" y="188" font-size="19" fill="#64748B">业界主流停留在 L3 —— Yio 把五个环节全部改造为机器可执行，为全自主 Agent 铺路</text>
  <line x1="80" y1="208" x2="1520" y2="208" stroke="#E2E8F0"/>

  <!-- ===== Ladder ===== -->
  <!-- L0 -->
  <rect x="90" y="720" width="140" height="60" fill="#E2E8F0" stroke="#F8FAFC" stroke-width="2"/>
  <text x="160" y="746" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">L0</text>
  <text x="160" y="766" text-anchor="middle" font-size="11" fill="#475569">纯人工开发</text>
  <!-- L1 -->
  <rect x="230" y="660" width="140" height="120" fill="#E2E8F0" stroke="#F8FAFC" stroke-width="2"/>
  <text x="300" y="686" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">L1</text>
  <text x="300" y="708" text-anchor="middle" font-size="11" fill="#475569">AI 辅助</text>
  <text x="300" y="724" text-anchor="middle" font-size="11" fill="#475569">代码补全</text>
  <!-- L2 -->
  <rect x="370" y="600" width="140" height="180" fill="#E2E8F0" stroke="#F8FAFC" stroke-width="2"/>
  <text x="440" y="626" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">L2</text>
  <text x="440" y="648" text-anchor="middle" font-size="11" fill="#475569">AI 结对开发</text>
  <text x="440" y="664" text-anchor="middle" font-size="11" fill="#475569">人工检查</text>
  <!-- L3 -->
  <rect x="510" y="540" width="140" height="240" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
  <text x="580" y="566" text-anchor="middle" font-size="15" font-weight="700" fill="#1D4ED8">L3</text>
  <text x="580" y="588" text-anchor="middle" font-size="11" fill="#1E40AF">半自主 Agent</text>
  <text x="580" y="604" text-anchor="middle" font-size="11" fill="#1E40AF">人工监督关键点</text>
  <text x="580" y="620" text-anchor="middle" font-size="11" fill="#1E40AF">和结果</text>
  <!-- L4 -->
  <rect x="650" y="480" width="140" height="300" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="2"/>
  <text x="720" y="506" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">L4</text>
  <text x="720" y="528" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">全自主 Agent</text>
  <text x="720" y="544" text-anchor="middle" font-size="11" fill="#047857">Yio 探索目标</text>
  <!-- L5 -->
  <rect x="790" y="420" width="140" height="360" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="860" y="446" text-anchor="middle" font-size="15" font-weight="700" fill="#6D28D9">L5</text>
  <text x="860" y="468" text-anchor="middle" font-size="11" fill="#6D28D9">多 Agent 协作</text>
  <text x="860" y="484" text-anchor="middle" font-size="11" fill="#6D28D9">远期</text>

  <line x1="84" y1="780" x2="936" y2="780" stroke="#CBD5E1" stroke-width="2"/>
  <text x="510" y="812" text-anchor="middle" font-size="13" fill="#94A3B8">AI 开发自治等级 · 自下而上，人工参与递减</text>

  <!-- L3 annotation -->
  <rect x="450" y="330" width="210" height="36" rx="18" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="555" y="354" text-anchor="middle" font-size="13" font-weight="700" fill="#1D4ED8">业界主流 · Yio 现在的位置</text>
  <line x1="555" y1="366" x2="578" y2="536" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- arrow L3 -> L4 -->
  <path d="M605,522 Q655,408 700,470" stroke="#059669" stroke-width="2.5" fill="none"/>
  <polygon points="708,478 694,466 693,479" fill="#059669"/>
  <text x="640" y="404" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">机器验证替代人工监督</text>

  <!-- ===== Right column: five machine-executable aspects ===== -->
  <text x="970" y="268" font-size="16" font-weight="700" fill="#0F172A">通往 L4 的五个机器可执行环节</text>

  <rect x="970" y="288" width="550" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="998" cy="328" r="5" fill="#059669"/>
  <text x="1016" y="334" font-size="16.5" font-weight="700" fill="#0F172A">能写</text>
  <text x="990" y="356" font-size="12.5" fill="#64748B">围栏内的标准 HTML/CSS，AI 直接生成与修改</text>

  <rect x="970" y="380" width="550" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="998" cy="420" r="5" fill="#059669"/>
  <text x="1016" y="426" font-size="16.5" font-weight="700" fill="#0F172A">能看</text>
  <text x="990" y="448" font-size="12.5" fill="#64748B">浏览器预览 + 矩形差分，画面由机器比对</text>

  <rect x="970" y="472" width="550" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="998" cy="512" r="5" fill="#059669"/>
  <text x="1016" y="518" font-size="16.5" font-weight="700" fill="#0F172A">能验证</text>
  <text x="990" y="540" font-size="12.5" fill="#64748B">Fence 校验、结构化报错，错误精确定位</text>

  <rect x="970" y="564" width="550" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="998" cy="604" r="5" fill="#059669"/>
  <text x="1016" y="610" font-size="16.5" font-weight="700" fill="#0F172A">能运行</text>
  <text x="990" y="632" font-size="12.5" fill="#64748B">一键打包进引擎，类型化 API 直接操作</text>

  <rect x="970" y="656" width="550" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="998" cy="696" r="5" fill="#059669"/>
  <text x="1016" y="702" font-size="16.5" font-weight="700" fill="#0F172A">能维护</text>
  <text x="990" y="724" font-size="12.5" fill="#64748B">文本源码进 Git，可评审、可回滚、可演进</text>

  <rect x="970" y="756" width="550" height="60" rx="12" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="1245" y="781" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">AI 生成 + AI 验收 + 人工抽检</text>
  <text x="1245" y="804" text-anchor="middle" font-size="12.5" fill="#047857">自主完成从需求到引擎内运行的完整闭环</text>
</svg>
