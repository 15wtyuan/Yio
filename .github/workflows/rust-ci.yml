name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 分支上验证 godot-smoke（gh workflow run rust-ci.yml --ref <branch>）——批 B 攒批期
  # 未开 PR，dispatch 是分支上真跑 CI 的唯一通道。
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (-D warnings)
        # 历史 warning 已清零（advisory 收紧为严门禁）。可辩护的测试/FFI 模式 lint 在各 crate
        # root 用 #![allow] 显式放行并注明理由；其余真错的已修。
        # yio_gui (Tauri 2) 在 Linux 经 pkg-config 拉 webkit2gtk/glib 系统库；它是
        # Windows-only 交付物（出 exe 供 Unity），Linux 不构建——clippy 门排除之（Windows 走
        # WebView2 无系统库依赖，test matrix 的 windows 腿仍全量编译覆盖）。
        run: cargo clippy --all-targets --workspace --exclude yio_gui -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # yio_gui (Tauri 2) 在 Linux 需 webkit2gtk/glib 系统库（pkg-config），是 Windows-only
          # 交付物，Linux CI 不构建。Windows 用 WebView2 无系统库依赖，保留全 workspace 编译覆盖。
          - os: ubuntu-latest
            cargo-exclude: '--exclude yio_gui'
          - os: windows-latest
            cargo-exclude: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace ${{ matrix.cargo-exclude }}
      - name: feature-gate check (parse feature off)
        # 不带 parse feature（scraper/cssparser）仍须全量编译——验证运行时配置不破。
        run: cargo build --workspace --no-default-features --all-targets ${{ matrix.cargo-exclude }}

  dll-artifact:
    name: Windows .dll artifact
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build release .dll
        run: cargo build -p yio_ffi_c --release
      - name: upload .dll
        uses: actions/upload-artifact@v4
        with:
          name: yio_ffi_c-windows-x64
          path: target/release/yio_ffi_c.dll
          retention-days: 7
      - name: build release exe (yio_pkg, bin=yio)
        run: cargo build -p yio_pkg --release
      - name: upload yio.exe
        uses: actions/upload-artifact@v4
        with:
          name: yio-exe-${{ github.sha }}
          path: target/release/yio.exe
          retention-days: 7

  dotnet-test:
    name: dotnet test (pure managed, tests/dotnet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: dotnet test
        run: dotnet test tests/dotnet/Yio.Tests.Core.csproj

  # 「改 Rust 必重出 dll」的仓库规矩机器化：release-check 的 staleness 门在 CI 拦截——
  # dll/exe 上次入库提交之后 crates/ 有源变更（xtask 除外，不进产物）即红。
  # GUI（packer/gui）计入——它直链 pkg/fence 编进 exe，与 dll/yio.exe 无条件同批重出。
  # 需要完整提交拓扑（产物锚点..HEAD 的 diff），浅克隆不够——fetch-depth: 0。
  # Release workflow 同样跑 release-check，自动继承该门。
  artifact-staleness:
    name: artifact staleness gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- release-check

  # HeadlessTests（P/Invoke 真 native）+ PublicApi 编译门。此前 CI 只跑纯 managed 的
  # Tests.Core，HeadlessTests 曾随 pkg 版本漂移静默腐烂（fixture v24 vs core v34）无人
  # 知——此 job 补上盲区：runner 现场编 Linux .so，替换输出目录（入库的 Windows dll
  # 仅 Windows P/Invoke 解析命中，Linux 解析 __DllName="yio_ffi_c" 走 .so）。
  dotnet-headless:
    name: dotnet headless (P/Invoke native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: build native lib (linux .so)
        run: cargo build -p yio_ffi_c --release
      - name: build headless tests
        run: dotnet build tests/dotnet/Yio.HeadlessTests/Yio.HeadlessTests.csproj
      - name: stage linux native lib into test output dir
        run: cp target/release/libyio_ffi_c.so tests/dotnet/Yio.HeadlessTests/bin/Debug/net10.0/
      - name: dotnet test (no-build)
        run: dotnet test tests/dotnet/Yio.HeadlessTests/Yio.HeadlessTests.csproj --no-build

  dotnet-publicapi:
    name: dotnet public-api compile gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # 公共 API 冻结签名编译校验（无测试用例）：0 警告 0 错误 = 过。
      - run: dotnet build tests/dotnet/Yio.PublicApi/Yio.PublicApi.csproj -warnaserror

  # #14 Godot 后端 CI smoke：引擎侧测试面只靠手动跑会静默腐烂（HeadlessTests fixture
  # 陈货先例）。现场 cargo build yio CLI + 现场打包 showcase（不吃入库 fixture，防腐
  # pkg 版本漂移陈货）+ 现场编 Linux .so（dotnet-headless 同款先例）+ Godot 4.7.2 mono
  # headless 跑 --yio-smoke 三档断言（帧循环 / DumpSceneJson 场景树探针 / 镜像池对象数）。
  # 退出码 + "[smoke] ALL PASS" grep 双断言——spike 教训：C# 脚本实例化失败 Godot 退出
  # 码仍 0，单看退出码会假绿。产物目录走 workspace output_dir（showcase-unity/Assets/
  # Bundles，runner 一次性重写不入库）。
  godot-smoke:
    name: godot smoke (headless showcase boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: build native lib + yio CLI (release)
        run: |
          cargo build -p yio_ffi_c --release
          cargo build -p yio_pkg --release
      - name: build showcase bundle (fresh, no tracked fixture)
        run: cargo run -p yio_pkg --release -- build showcase
      - name: cache Godot 4.7.2 mono (linux)
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.7.2-mono-linux-x86_64
      - name: download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -fL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          unzip -q godot.zip && rm godot.zip
          chmod +x Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64
      - name: stage native lib next to Godot binary
        run: cp target/release/libyio_ffi_c.so ~/godot/Godot_v4.7.2-stable_mono_linux_x86_64/
      - name: build C# + import project
        working-directory: godot/showcase-godot
        run: |
          export LD_LIBRARY_PATH=$HOME/godot/Godot_v4.7.2-stable_mono_linux_x86_64:$LD_LIBRARY_PATH
          dotnet build YioShowcase.csproj
          $HOME/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64 --headless --import --path . 2>&1 | tail -3
      - name: run smoke (exit code + output grep)
        working-directory: godot/showcase-godot
        run: |
          export LD_LIBRARY_PATH=$HOME/godot/Godot_v4.7.2-stable_mono_linux_x86_64:$LD_LIBRARY_PATH
          set -o pipefail
          $HOME/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64 --headless --path . --yio-smoke 2>&1 | tee smoke.log
          grep -q '\[smoke\] ALL PASS' smoke.log
