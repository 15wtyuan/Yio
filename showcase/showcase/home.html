<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Yio 靶子冻结 Showcase · 首页</title>
  <style>
  /* fit-width 全屏覆盖适配（#110）：nav-grid flex-grow 吸收画布富余高度（行组垂直居中、
     footer 落底——拖高窗口不再留大片死区）；窗口拖矮（画布 < 内容）时 root 滚动兜底，
     底部列表不再被屏幕裁掉（浏览器「内容超视口即滚动」同款语义）。
     #116 content-box 适配：48px 内缩由 root padding 迁至四个 section 自身 padding
     （content-box 下 root 的 100vw+padding 会外溢 96px；迁移后各 section 内容几何
     与迁移前逐像素等值，root 外框恒 1920×1080）。 */
  .root {display:flex;flex-direction:column; width:100vw; height:100vh; background-color:#0e1620; background-image:radial-gradient(1100px 560px at 82% -12%, rgba(95,180,212,0.10), transparent 60%); gap:32px; overflow-y:auto; }
  .hero {display:flex; flex-direction:row; align-items:center; gap:24px; padding:48px 48px 0 48px; }
  .hero-logo { width:92px; height:92px; }
  .hero-title { color:#e6ebf2; font-size:46px; font-weight:800; letter-spacing:-0.92px; }
  .hero-sub { color:#9aa0b4; font-size:16px; margin-top:6px; }
  .hero-version { color:#8ec5d8; font-size:13px; font-weight:700; letter-spacing:0.52px; }
  .actions {display:flex; flex-direction:row; gap:14px; padding:0 48px; }
  .btn-primary { background-color:#5fb4d4; color:#08131a; font-size:20px; font-weight:800; letter-spacing:0.4px; padding:14px 38px; border-radius:10px; box-shadow:0 0 0 1px rgba(95,180,212,0.5), 0 8px 26px rgba(95,180,212,0.30); }
  .btn-ghost { background-color:rgba(95,180,212,0.06); color:#8ec5d8; font-size:17px; font-weight:600; padding:14px 30px; border-radius:10px; box-shadow:inset 0 0 0 1px rgba(95,180,212,0.22); }
  .btn-primary:hover { filter:brightness(1.08); transform:translateY(-1px); }
  .btn-ghost:hover { background-color:rgba(95,180,212,0.12); box-shadow:inset 0 0 0 1px rgba(95,180,212,0.42); }
  .nav-grid {display:flex; flex-direction:row; flex-wrap:wrap; gap:20px; flex-grow:1; align-content:center; padding:0 48px; }
  .nav-card {display:flex; width:376px; background-color:rgba(21,36,51,0.72); border-radius:10px; padding:22px; gap:14px; flex-direction:row; align-items:center; box-shadow:inset 0 0 0 1px rgba(95,180,212,0.10), inset 0 1px 0 rgba(255,255,255,0.04); transition:transform .18s, background-color .18s, box-shadow .18s; }
  .nav-card:hover { transform:translateY(-3px); background-color:rgba(26,47,69,0.85); box-shadow:inset 0 0 0 1px rgba(95,180,212,0.34), inset 0 1px 0 rgba(255,255,255,0.06); }
  .nav-card-icon { width:52px; height:52px; }
  .nav-card-body {display:flex;flex-direction:column; gap:4px; flex-grow:1; }
  .nav-card-label { color:#e6ebf2; font-size:21px; font-weight:700; letter-spacing:-0.21px; }
  .nav-card-desc { color:#9aa0b4; font-size:13px; }
  .nav-card-arrow { color:#5fb4d4; font-size:22px; opacity:0.65; transition:transform .18s, opacity .18s; }
  .nav-card:hover .nav-card-arrow { transform:translateX(4px); opacity:1; }
  .quick-bar {display:flex; flex-direction:row; gap:12px; overflow-x:auto; padding-bottom:6px; max-width:1400px; align-self:center; }
  .quick-chip {display:flex; flex-direction:row; align-items:center; gap:8px; flex-shrink:0; background-color:rgba(21,36,51,0.72); border-radius:10px; padding:12px 18px; color:#9aa0b4; font-size:14px; box-shadow:inset 0 0 0 1px rgba(95,180,212,0.10); transition:color .15s, box-shadow .15s; }
  .quick-chip:hover { color:#e6ebf2; box-shadow:inset 0 0 0 1px rgba(95,180,212,0.34); }
  .quick-icon { width:24px; height:24px; }
  .footbar {display:flex; flex-direction:row; justify-content:space-between; align-items:center; padding:0 48px 48px 48px; }
  .foot-text { color:#6c7080; font-size:13px; }
  .foot-strong { color:#8ec5d8; font-weight:700; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  .nav-card { animation:fadeIn .4s both; }
  /* nth-child 错峰入场（M2 运行时 :nth-child 已就绪；delay 进 animation 简写第 2 个 time token） */
  .nav-card:nth-child(1){animation:fadeIn .4s .05s both}
  .nav-card:nth-child(2){animation:fadeIn .4s .1s both}
  .nav-card:nth-child(3){animation:fadeIn .4s .15s both}
  .nav-card:nth-child(4){animation:fadeIn .4s .2s both}
  .nav-card:nth-child(5){animation:fadeIn .4s .25s both}
  .nav-card:nth-child(6){animation:fadeIn .4s .3s both}
  .nav-card:nth-child(7){animation:fadeIn .4s .35s both}
  </style>
</head>
