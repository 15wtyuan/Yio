<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>星阙行纪 百宝匣</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    .shade { position:absolute; left:0; top:0; width:100%; height:100%; background-image:linear-gradient(to right, rgba(3,11,10,0.92), rgba(4,15,13,0.42) 46%, rgba(2,8,7,0.92)); }
    .menu-head { position:absolute; left:42px; right:42px; top:30px; z-index:3; display:flex; flex-direction:row; align-items:flex-start; }
    .menu-head > .title-stack { position:relative; z-index:0; }
    .close-button { position:absolute; right:0; top:0; display:flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:50%; color:#c9c2ad; background-color:rgba(6,23,20,0.78); box-shadow:inset 0 0 0 1px rgba(214,176,97,0.22); font-family:JetBrainsMono; font-size:11px; }
    .category-nav { position:absolute; left:42px; top:124px; z-index:3; display:flex; flex-direction:column; gap:8px; }
    .category { display:flex; align-items:center; justify-content:center; width:56px; height:56px; padding:12px; border-radius:50%; background-color:rgba(4,20,17,0.78); box-shadow:inset 0 0 0 1px rgba(214,176,97,0.16); }
    .category:hover { background-color:#184239; }
    .category-active { background-color:#a74b3c; box-shadow:inset 0 0 0 2px rgba(255,229,178,0.34); }
    .category img { width:34px; height:34px; }
    .selected-stage { position:absolute; left:138px; top:112px; bottom:205px; width:46%; z-index:2; display:flex; flex-direction:column; justify-content:center; align-items:center; }
    .halo-a { position:absolute; width:390px; height:390px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(215,177,98,0.16); }
    .halo-b { position:absolute; width:250px; height:250px; border-radius:50%; box-shadow:inset 0 0 0 1px rgba(109,169,166,0.23); }
    .artifact-art { position:relative; z-index:1; width:220px; height:220px; padding:34px; border-radius:50%; background-image:radial-gradient(circle at 42% 38%, rgba(116,182,184,0.34), rgba(15,53,47,0.60) 56%, rgba(5,19,17,0.82)); box-shadow:0 22px 26px rgba(0,0,0,0.30); transform:rotate(-8deg); }
    .artifact-caption { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; margin-top:10px; }
    .rarity { color:#d2ae67; font-family:JetBrainsMono; font-size:10px; letter-spacing:3px; }
    .artifact-name { color:#fff1cf; font-size:28px; font-weight:800; letter-spacing:4px; margin-top:4px; }
    .artifact-origin { color:#80968f; font-size:13px; margin-top:6px; }
    .detail-side { position:absolute; right:50px; top:124px; bottom:202px; z-index:2; display:flex; flex-direction:column; width:36%; padding:26px 28px; background-color:rgba(3,15,13,0.58); box-shadow:inset 1px 0 0 rgba(214,176,97,0.13); }
    .detail-description { color:#abb7b1; font-size:14px; line-height:1.72; margin-top:16px; }
    .stat-list { display:flex; flex-direction:column; margin-top:18px; }
    .stat-row { display:flex; align-items:center; min-height:44px; box-shadow:inset 0 -1px 0 rgba(214,176,97,0.12); }
    .stat-label { color:#8ea099; font-size:13px; }
    .stat-value { margin-left:auto; color:#e8c177; font-family:JetBrainsMono; font-size:16px; font-weight:800; }
    .effect-title { color:#fff0cf; font-size:15px; font-weight:800; margin-top:16px; }
    .effect-copy { color:#8fa19a; font-size:12px; line-height:1.55; margin-top:6px; }
    .item-dock { position:absolute; left:42px; right:42px; bottom:24px; z-index:4; display:flex; align-items:center; gap:10px; padding:9px 12px; background-color:rgba(3,14,12,0.94); box-shadow:inset 0 0 0 1px rgba(214,176,97,0.18), 0 18px 42px rgba(0,0,0,0.30); }
    .dock-label { display:flex; flex-direction:column; width:116px; gap:4px; position:relative; z-index:0; }
    .dock-title { color:#fff0cf; font-size:14px; font-weight:800; }
    .dock-count { color:#77908a; font-family:JetBrainsMono; font-size:10px; }
    .slot-strip { display:flex; gap:8px; flex-grow:1; overflow:hidden; position:relative; z-index:0; }
    .item-slot { position:relative; display:flex; align-items:center; justify-content:center; width:62px; height:62px; flex-shrink:0; padding:10px; background-color:#0b2824; box-shadow:inset 0 0 0 1px rgba(211,174,96,0.14); }
    .item-slot:hover { background-color:#154039; }
    .slot-selected { background-color:#173c36; box-shadow:inset 0 0 0 2px #d1aa61; }
    .slot-icon { width:40px; height:40px; }
    .item-slot > img { position:relative; z-index:0; }
    .slot-count { position:absolute; right:5px; bottom:3px; color:#e9ddc2; font-family:JetBrainsMono; font-size:9px; }
    .dock-actions { display:flex; flex-direction:column; width:128px; gap:5px; color:#91a29c; font-size:9px; position:relative; z-index:0; }
  </style>
</head>
<body>
  <div class="game-screen">
    <div class="moon"></div><div class="mountain-far"></div><div class="mountain-near"></div><div class="mist"></div><div class="shade"></div>
    <div class="menu-head"><div class="title-stack"><span class="screen-title">百宝匣</span><span class="screen-subtitle">CELESTIAL RELIC ARCHIVE</span></div><button class="close-button">ESC</button></div>
    <div class="category-nav"><button class="category category-active"><img src="../../res/icons/weapon.png" alt=""></button><button class="category"><img src="../../res/icons/shield.png" alt=""></button><button class="category"><img src="../../res/icons/item-potion.png" alt=""></button><button class="category"><img src="../../res/icons/item-scroll.png" alt=""></button><button class="category"><img src="../../res/icons/item-chest.png" alt=""></button></div>
    <div class="selected-stage"><div class="halo-a"></div><div class="halo-b"></div><img class="artifact-art" src="../../res/icons/weapon.png" alt="照夜星剑"><div class="artifact-caption"><span class="rarity">LEGENDARY RELIC · 传世</span><span class="artifact-name">照夜星剑</span><span class="artifact-origin">天枢院藏 · 三尺七寸 · 已装备</span></div></div>
    <div class="detail-side"><span class="hud-label">RELIC LORE</span><div class="detail-description">剑身以扶桑金锻成，出鞘时可引星辉附刃。传闻它曾在长夜中照亮归乡古道，因此得名照夜。</div><div class="stat-list"><div class="stat-row"><span class="stat-label">剑势</span><span class="stat-value">284</span></div><div class="stat-row"><span class="stat-label">破罡</span><span class="stat-value">17.6%</span></div><div class="stat-row"><span class="stat-label">会心</span><span class="stat-value">8.4%</span></div><div class="stat-row"><span class="stat-label">灵识需求</span><span class="stat-value">12</span></div></div><div class="effect-title">星辉满溢</div><div class="effect-copy">连续命中积蓄剑意。剑意圆满后，下一式穿透目标护体罡气，并回复少量灵脉。</div></div>
    <div class="item-dock"><div class="dock-label"><span class="dock-title">灵兵匣</span><span class="dock-count">14 / 36</span></div><div class="slot-strip"><button class="item-slot slot-selected"><img class="slot-icon" src="../../res/icons/weapon.png" alt=""><span class="slot-count">1</span></button><button class="item-slot"><img class="slot-icon" src="../../res/icons/item-wand.png" alt=""><span class="slot-count">1</span></button><button class="item-slot"><img class="slot-icon" src="../../res/icons/item-staff.png" alt=""><span class="slot-count">1</span></button><button class="item-slot"><img class="slot-icon" src="../../res/icons/shield.png" alt=""><span class="slot-count">1</span></button><button class="item-slot"><img class="slot-icon" src="../../res/icons/ring.png" alt=""><span class="slot-count">2</span></button><button class="item-slot"><img class="slot-icon" src="../../res/icons/item-gem.png" alt=""><span class="slot-count">18</span></button></div><div class="dock-actions"><div class="hint"><span class="key">E</span><span>装备</span></div><div class="hint"><span class="key">R</span><span>比较</span></div><div class="hint"><span class="key">F</span><span>锁定</span></div></div></div>
  </div>
</body>
</html>
