[package]
name = "yio_pkg"
# 与 unity/package/package.json 同轨（release-check 断言）；`yio version` 的 cli/unity
# 字段都取本值。发版 tag 前必须先 bump 两者 + 补 CHANGELOG。
version = "0.0.18"
edition = "2021"

[[bin]]
name = "yio"
path = "src/main.rs"

[dependencies]
yio_core = { path = "../../core" }
yio_fence = { path = "../../fence" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
etagere = "0.3"
# build.rs 的 border/bg 共存 warning 读 taffy_style.border 宽度（Length tag 判定）。
taffy = { version = "0.14", features = ["serde"] }

[dev-dependencies]
